<aside class="sidebar" [class.open]="isOpen">
  <div class="sidebar-header">
    <button 
      class="close-sidebar" 
      (click)="closeSidebar()"
      aria-label="Close sidebar"
    >
      <i class="fas fa-times"></i>
    </button>
  </div>
  
  <nav class="nav-menu">
    <div class="nav-section">
      <h3 class="nav-section-title">Main</h3>
      <ul class="nav-list">
        <li *ngFor="let item of mainNavItems" class="nav-item">
          <a 
            [routerLink]="item.route" 
            routerLinkActive="active"
            class="nav-link"
            (click)="closeSidebar()"
          >
            <i [class]="'fas ' + item.icon + ' nav-icon'"></i>
            <span class="nav-label">{{ item.label }}</span>
            <span *ngIf="item.badge" class="nav-badge">{{ item.badge }}</span>
          </a>
        </li>
      </ul>
    </div>
    
    <div class="nav-section">
      <h3 class="nav-section-title">Management</h3>
      <ul class="nav-list">
        <li *ngFor="let item of managementNavItems" class="nav-item">
          <a 
            [routerLink]="item.route" 
            routerLinkActive="active"
            class="nav-link"
            (click)="closeSidebar()"
          >
            <i [class]="'fas ' + item.icon + ' nav-icon'"></i>
            <span class="nav-label">{{ item.label }}</span>
            <span *ngIf="item.badge" class="nav-badge">{{ item.badge }}</span>
          </a>
        </li>
      </ul>
    </div>
  </nav>
  
  <div class="sidebar-footer">
    <div class="help-card">
      <div class="help-icon">
        <i class="fas fa-question-circle"></i>
      </div>
      <div class="help-content">
        <h4>Need Help?</h4>
        <p>Check our documentation for guidance</p>
        <button class="help-btn">Get Help</button>
      </div>
    </div>
  </div>
</aside>

<!-- Mobile overlay -->
<div 
  *ngIf="isOpen" 
  class="sidebar-overlay" 
  (click)="closeSidebar()"
></div>
